bio: |
  Edo Giusto is a Mid-Career Fellow at the Vienna Center for Advanced Studies (ViCAS), University of Vienna and a co-founder of Helix 42, where he
  heads quantum computing. Previously, he was an Assistant Professor at the Department of Electrical
  Engineering and Information Technology of the University of Naples Federico II.
  His research focuses on the dependability of Quantum-High Performance Computing (QHPC) systems:
  reproducibility of computation results, resilience to hardware and software failures, and
  security and privacy of code and data.

